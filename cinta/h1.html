<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Beloved</title>
    <!-- Mengambil font cantik dari Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            font-family: 'Poppins', sans-serif;
        }

        .main-content {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1;
            /* Latar belakang pink dengan animasi gradien bergerak agar tidak polos */
            background: linear-gradient(135deg, #ffdde1, #ee9ca7, #ffc3a0, #ffdde1);
            background-size: 300% 300%;
            animation: gradientMove 8s ease infinite;
        }

        .main-content::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(#ffffff50 2px, transparent 2px);
            background-size: 30px 30px;
            z-index: -1;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .card {
            text-align: center;
            opacity: 0;
            transform: scale(0.9);
            transition: all 1.5s ease-in-out;
            transition-delay: 0.5s;
        }

        .card.show {
            opacity: 1;
            transform: scale(1);
        }

        .image-frame {
            width: 250px;
            height: 250px;
            margin: 0 auto;
            border: 12px solid #ffffff;
            border-bottom-width: 35px;
            border-radius: 4px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            overflow: hidden;
            background: #fff;
            transform: rotate(-3deg);
            transition: transform 0.4s ease;
        }

        .image-frame:hover {
            transform: rotate(0deg) scale(1.05);
        }

        .image-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .title {
            margin-top: 25px;
            font-family: 'Dancing Script', cursive;
            font-size: 3.5rem;
            color: #b71c1c;
            text-shadow: 2px 2px 4px rgba(255, 255, 255, 0.6);
            letter-spacing: 2px;
        }

        .music-player {
            margin-top: 20px;
            opacity: 0;
            transform: translateY(20px);
            transition: all 1s ease-in-out;
            transition-delay: 1s; 
        }

        .card.show .music-player {
            opacity: 1;
            transform: translateY(0);
        }

        audio {
            width: 280px;
            height: 40px;
            border-radius: 30px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            outline: none;
        }

        .curtain-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        .curtain {
            position: absolute;
            top: 0;
            width: 50%;
            height: 100%;
            background: #d81b60;
            transition: transform 1.5s cubic-bezier(0.645, 0.045, 0.355, 1);
            pointer-events: auto;
            box-shadow: 0 0 25px rgba(0,0,0,0.6);
        }

        .curtain::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                to right,
                transparent,
                transparent 10%,
                rgba(0, 0, 0, 0.15) 12%,
                transparent 15%
            );
        }

        .curtain-left { left: 0; transform-origin: left; }
        .curtain-right { right: 0; transform-origin: right; }

        .press-btn {
            position: relative;
            z-index: 11;
            padding: 15px 50px;
            font-size: 1.2rem;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            color: #fff;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid #fff;
            backdrop-filter: blur(5px);
            border-radius: 50px;
            cursor: pointer;
            pointer-events: auto;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 3px;
            animation: pulse 2s infinite;
        }

        .press-btn:hover {
            background: #fff;
            color: #d81b60;
            transform: translateY(-3px) scale(1.05);
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(255, 255, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0); }
        }

        .curtain-container.open .curtain-left {
            transform: translateX(-100%);
        }

        .curtain-container.open .curtain-right {
            transform: translateX(100%);
        }

        .curtain-container.open .press-btn {
            opacity: 0;
            transform: scale(0);
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="main-content">
        <div class="card" id="contentCard">
            <div class="image-frame">
                <img src="./asset/yusyus.jpg" alt="My Girlfriend">
            </div>
            <h1 class="title">my beloved girlfriend</h1>
            <div class="music-player">
                <audio id="bgMusic" controls loop>
                    <source src="./asset/gachalife.mp3" type="audio/mpeg">
                    Browser Anda tidak mendukung elemen audio.
                </audio>
            </div>
        </div>
    </div>

    <div class="curtain-container" id="curtainContainer">
        <div class="curtain curtain-left"></div>
        <div class="curtain curtain-right"></div>
        <button id="pressBtn" class="press-btn">press</button>
    </div>

    <script>
        const btn = document.getElementById('pressBtn');
        const curtainContainer = document.getElementById('curtainContainer');
        const contentCard = document.getElementById('contentCard');
        const bgMusic = document.getElementById('bgMusic');

        btn.addEventListener('click', () => {
            curtainContainer.classList.add('open');
            contentCard.classList.add('show');
            bgMusic.play();
        });
    </script>

</body>
</html>
