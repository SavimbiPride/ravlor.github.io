<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://fonts.googleapis.com/css2?family=Barrio&display=swap" rel="stylesheet"/>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Barrio", cursive;
      }

      body {
        min-height: 100vh;

        background-image: url("img/background.jpeg");
        background-size: cover;
        background-position: center;

        padding: 40px;

        transition:
          opacity 0.45s ease,
          transform 0.45s ease,
          filter 0.45s ease;
      }

      .header {
        display: flex;
        align-items: center;
        justify-content: center;

        position: relative;

        margin-bottom: 70px;
      }

      .header button {
        position: absolute;
        left: 0;
        background: #2e3f8f;
        color: white;
        border: none;
        padding: 12px 28px;
        font-size: 20px;
        border-radius: 14px;
        cursor: pointer;
        transition:
          transform 0.25s,
          background 0.25s;
      }

      .header button:hover {
        background: #1e2d70;
        transform: scale(1.08);
      }

      .header h1 {
        font-size: 50px;
      }

      .content {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 40px; 
      }

      .text {
        font-size: 60px;
        line-height: 1.25;

        max-width: 500px;
      }

      .character img {
        width: 280px;
      }

      .fade-out {
        opacity: 0;
        transform: scale(0.96);
        filter: blur(6px);
      }

      @media (max-width: 768px) {
        .header h1 {
          font-size: 40px;
        }

        .text {
          font-size: 38px;
          text-align: center;
        }

        .content {
          flex-direction: column;
          gap: 30px;
        }

        .character img {
          width: 200px;
        }
      }
    </style>
  </head>

  <body>
    <div class="header">
      <button onclick="goPage('h1.html')">Back</button>

      <h1>note</h1>
    </div>

    <div class="content">
      <div class="text">
        aku record<br />
        pesan mu dan<br />
        aku simpan :3
      </div>

      <div class="character">
        <img src="img/abbie.png" />
      </div>
    </div>

    <script>
      function goPage(page) {
        document.body.classList.add("fade-out");

        setTimeout(() => {
          window.location.href = page;
        }, 400);
      }
    </script>
  </body>
</html>
