<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="css.css" />

    <link
      href="https://fonts.googleapis.com/css2?family=Barrio&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Barrio", cursive;
      }

      body {
        min-height: 100vh;

        background-image: url("img/background.jpeg");
        background-size: cover;
        background-position: center;

        padding: 40px;

        transition:
          opacity 0.45s ease,
          transform 0.45s ease;
      }

      /* BACK BUTTON */

      .back-btn {
        position: absolute;
        top: 40px;
        left: 40px;

        background: #2e3f8f;
        color: white;

        border: none;

        padding: 12px 28px;

        font-size: 20px;

        border-radius: 14px;

        cursor: pointer;

        transition:
          transform 0.25s,
          background 0.25s;
      }

      .back-btn:hover {
        background: #1e2d70;
        transform: scale(1.08);
      }

      /* TITLE */

      h1 {
        text-align: center;
        font-size: 50px;
        margin-bottom: 60px;
      }

      /* CONTENT */

      .content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 25px;
      }

      /* VIDEO WRAPPER */

      .video-wrapper {
        width: 100%;
        max-width: 700px;

        aspect-ratio: 16/9;

        border-radius: 15px;

        overflow: hidden;

        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      }

      /* IFRAME VIDEO */

      .video-wrapper iframe {
        width: 100%;
        height: 100%;

        border: none;
      }

      /* NOTE TEXT */

      .note-text {
        text-align: center;
      }

      .note-text h2 {
        font-size: 40px;
        margin-bottom: 10px;
      }

      .note-text p {
        font-size: 24px;
      }

      /* TRANSITION */

      .fade-out {
        opacity: 0;
        transform: scale(0.96);
      }

      /* MOBILE */

      @media (max-width: 768px) {
        h1 {
          font-size: 40px;
        }

        .back-btn {
          top: 25px;
          left: 25px;
        }

        .note-text h2 {
          font-size: 30px;
        }

        .note-text p {
          font-size: 20px;
        }
      }
    </style>
  </head>

  <body>
    <button class="back-btn" onclick="goPage('h1.html')">Back</button>

    <h1>video</h1>

    <div class="content">
      <div class="video-wrapper">
        <iframe
          src="https://drive.google.com/file/d/1gUm_sp8HCO6BcE-IBGs8KjKargu5ipEW/preview"
          allow="autoplay"
          allowfullscreen
        >
        </iframe>
      </div>
      <div class="note-text">
        <h2>note</h2>
        <p>
          aku gak tau volumenya keras atau enggak<br />
          itu bisa di atur aja di video nya :3 dan atur resolusi nya juga ada kok :3
        </p>
      </div>
    </div>

    <script>
      function goPage(page) {
        document.body.classList.add("fade-out");

        setTimeout(() => {
          window.location.href = page;
        }, 400);
      }
    </script>
  </body>
</html>
