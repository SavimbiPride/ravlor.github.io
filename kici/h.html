<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>miaw :3</title>
    <link rel="icon" href="img/copyright.png" type="image/png">
</head>
<style>
    body {
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background: #222;
        font-family: serif;
    }

    .card {
        width: 100vw;
        height: 100vh;
        background: linear-gradient(90deg, #d61408, #f04e1a);
        border-radius: 20px;
        border: 10px solid #000;
        box-shadow: 0 0 10px #000 inset;
        position: relative;
        overflow: hidden;
        transition: transform 0.5s ease-out;
    }

    @keyframes slideOutLeft {
        from {
            transform: translateX(0);
            opacity: 1;
        }

        to {
            transform: translateX(-100vw);
            opacity: 0;
        }
    }

    .slide-out {
        animation: slideOutLeft 0.5s forwards;
    }

    .title {
        font-size: 60px;
        font-weight: bold;
        color: white;
        position: absolute;
        top: 20px;
        left: 50px;
    }

    .star {
        position: absolute;
        width: 100%;
        height: 100%;
    }

    .star-line {
        position: absolute;
        width: 280px;
        height: 18px;
        background: #262626;
        border-radius: 5px;
    }

    .l1 {
        top: 18%;
        left: 50%;
        transform: translateX(-50%) rotate(72deg);
    }

    .l2 {
        top: 18%;
        left: 50%;
        transform: translateX(-50%) rotate(-72deg);
    }

    .l3 {
        top: 50%;
        left: 0%;
        transform: translateY(-50%) rotate(0deg);
    }

    .l4 {
        top: 50%;
        right: 0%;
        transform: translateY(-50%) rotate(180deg);
    }

    .l5 {
        bottom: 18%;
        left: 50%;
        transform: translateX(-50%) rotate(108deg);
    }

    .l6 {
        bottom: 18%;
        left: 50%;
        transform: translateX(-50%) rotate(-108deg);
    }

    .nav {
        position: absolute;
        bottom: 40px;
        right: 40px;
        display: flex;
        gap: 20px;
    }

    .nav-btn {
        width: 70px;
        height: 70px;
        background: #888;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 35px;
        cursor: pointer;
        user-select: none;
    }
</style>

<body>
    <div id="mainCard" class="card">
        <div class="inner-border"></div>
        <div class="title">kartu ucapan :3</div>
        <div class="star">
            <div class="star-line l1"></div>
            <div class="star-line l2"></div>
            <div class="star-line l3"></div>
            <div class="star-line l4"></div>
            <div class="star-line l5"></div>
            <div class="star-line l6"></div>
        </div>

        <div class="nav">
            <div id="next" class="nav-btn">→</div>
        </div>

    </div>

    <script>
        document.getElementById('next').addEventListener('click', function () {
            const cardElement = document.getElementById('mainCard');
            cardElement.classList.add('slide-out');
            setTimeout(function () {
                window.location.href = 'h2.html';
            }, 500);
        });
    </script>
</body>

</html>
