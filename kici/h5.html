<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hope</title>
    <link rel="icon" href="img/copyright.png" type="image/png">
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #222;
            font-family: serif;
        }

        .card {
            width: 100vw;
            height: 100vh;
            background: linear-gradient(90deg, #d61408, #f04e1a);
            border-radius: 20px;
            border: 10px solid #000;
            box-shadow: inset 0 0 10px #000;
            position: relative;
            overflow: hidden;
            transform: translateX(100vw);
        }

        /* ================= ANIMATION ================= */
        @keyframes slideInRight {
            from { transform: translateX(100vw); }
            to { transform: translateX(0); }
        }

        @keyframes slideOutLeft {
            from { transform: translateX(0); opacity: 1; }
            to { transform: translateX(-100vw); opacity: 0; }
        }

        @keyframes slideOutRight {
            from { transform: translateX(0); opacity: 1; }
            to { transform: translateX(100vw); opacity: 0; }
        }

        .animate-in { animation: slideInRight 0.5s forwards; }
        .animate-out-left { animation: slideOutLeft 0.5s forwards; }
        .animate-out-right { animation: slideOutRight 0.5s forwards; }

        /* ================= TITLE ================= */
        h1 {
            position: absolute;
            top: 8%;
            left: 50%;
            transform: translateX(-50%);
            max-width: 80%;
            text-align: center;
            font-size: 32px;
            line-height: 1.4;
            color: #fff;
            text-shadow: 2px 2px 6px #000;
            margin: 0;
        }

        /* ================= IMAGE ================= */
        .img {
            position: absolute;
            top: 55%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .img img {
            width: 320px; /* ← gambar diperbesar */
            border: 3px solid #000;
            border-radius: 14px;
            box-shadow: 0 6px 12px rgba(0,0,0,0.4);
        }

        /* ================= NAV ================= */
        .nav {
            position: absolute;
            bottom: 40px;
            right: 40px;
            display: flex;
            gap: 20px;
        }

        .nav-btn {
            width: 70px;
            height: 70px;
            background: #888;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 35px;
            cursor: pointer;
            user-select: none;
        }
    </style>
</head>

<body>

    <div id="mainCard" class="card">

        <h1>
            dari ravlor, (miwa)  
            <br>
            “semoga sembuh dan bisa main lagi...”
        </h1>

        <div class="img">
            <img src="img/mew-5.png.png" alt="mew">
        </div>

        <div class="nav">
            <div id="prev" class="nav-btn">←</div>
            <div id="next" class="nav-btn">→</div>
        </div>

    </div>

    <script>
        const ANIMATION_DURATION = 500;
        const cardElement = document.getElementById('mainCard');

        window.onload = () => {
            cardElement.classList.add('animate-in');
        };

        document.getElementById('prev').onclick = () => {
            cardElement.classList.add('animate-out-right');
            setTimeout(() => location.href = 'h4.html', ANIMATION_DURATION);
        };

        document.getElementById('next').onclick = () => {
            cardElement.classList.add('animate-out-left');
            setTimeout(() => location.href = 'h6.html', ANIMATION_DURATION);
        };
    </script>

</body>
</html>
