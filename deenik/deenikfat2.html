<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deenik is fatty</title>

    <style>
        @font-face {
            font-family: 'FPEFont';
            src: url('assets/Barrio-Regular.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            min-height: 100svh;
            background: #1f1f1f;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'FPEFont', Arial, sans-serif;
            padding: 20px;
        }

        .paper {
            position: relative;
            width: min(95%, 1000px);
            height: min(600px, calc(100svh - 40px));
            min-height: 480px;
            background-color: #ffffff;
            overflow: hidden;
            background-image:
                linear-gradient(to right,
                    transparent 13%,
                    #d47d89 13%,
                    #d47d89 13.3%,
                    transparent 13.3%
                ),
                repeating-linear-gradient(to bottom,
                    transparent 0px,
                    transparent 30px,
                    #70c7ef 31px,
                    #70c7ef 32px
                );
        }

        /* Logo */
        .logo {
            position: absolute;
            top: 20px;
            left: 6%;
            width: clamp(75px, 11vw, 110px);
            aspect-ratio: 1 / 1;
            border: 7px solid #403747;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: white;
            z-index: 4;
            overflow: hidden;
        }

        .logo img {
            width: 85%;
            height: 85%;
            object-fit: contain;
            display: block;
        }

        /* Karakter di Sisi Kiri */
        .character {
            position: absolute;
            bottom: 0;
            left: 2%;
            width: clamp(220px, 34%, 350px);
            height: 75%;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            z-index: 2;
            pointer-events: none;
        }

        .character img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            object-position: bottom center;
            display: block;
        }

        /* Bagian Dialog & Tombol Continue di Sisi Kanan */
        .dialogue-section {
            position: absolute;
            top: 14%;
            right: 8%;
            width: clamp(280px, 52%, 490px);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: clamp(22px, 4vh, 36px);
            z-index: 3;
        }

        /* Gelembung Pikiran (Thought Bubble) */
        .thought-bubble {
            position: relative;
            width: 100%;
            min-height: clamp(120px, 23vh, 165px);
            background: #8a868d;
            border-radius: 50px;
            padding: 25px 35px;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: #ffffff;
            font-size: clamp(20px, 2.8vw, 30px);
            line-height: 1.3;
        }

        .thought-bubble::before {
            content: "";
            position: absolute;
            bottom: 18px;
            left: -34px;
            width: 24px;
            height: 24px;
            background: #8a868d;
            border-radius: 50%;
        }

        .thought-bubble::after {
            content: "";
            position: absolute;
            bottom: -4px;
            left: -62px;
            width: 22px;
            height: 22px;
            background: #8a868d;
            border-radius: 50%;
        }

        /* Tombol Continue */
        .button {
            width: min(360px, 90%);
            height: clamp(58px, 10vh, 78px);
            border: none;
            border-radius: 50px;
            background: #403747;
            color: white;
            font-family: 'FPEFont', Arial, sans-serif;
            font-size: clamp(22px, 3vw, 30px);
            cursor: pointer;
            transition: 0.2s;
        }

        .button:hover {
            background: #55495e;
            transform: scale(1.04);
        }

        /* Music Player */
        .music-player {
            position: absolute;
            right: 0;
            bottom: 0;
            width: clamp(250px, 35%, 350px);
            min-height: 190px;
            background: #95aaa7;
            border-radius: 35px 0 0 0;
            padding: 15px 20px;
            z-index: 4;
        }

        .music-title {
            text-align: center;
            font-size: clamp(16px, 2vw, 20px);
            color: black;
            margin-bottom: 20px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .music-line {
            width: 100%;
            height: 5px;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 10px;
            cursor: pointer;
            overflow: hidden;
            touch-action: none;
        }

        .music-progress {
            width: 0%;
            height: 100%;
            background: #403747;
            border-radius: 10px;
            transition: width 0.1s linear;
        }

        .time-display {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            margin-top: 6px;
            color: #29232d;
        }

        .player-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 25px;
            margin-top: 12px;
        }

        .player-controls button {
            border: none;
            background: transparent;
            font-size: 23px;
            color: #403747;
            cursor: pointer;
            transition: 0.2s;
            padding: 5px;
        }

        .player-controls button:hover {
            transform: scale(1.2);
            color: white;
        }

        .volume-control {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 12px;
        }

        .volume-control span {
            font-size: 15px;
            color: #403747;
        }

        .volume-control input {
            width: min(110px, 45%);
            height: 5px;
            accent-color: #403747;
            cursor: pointer;
        }

        .volume-value {
            font-size: 12px;
            min-width: 35px;
            text-align: right;
        }

        /* Tablet & Mobile Media Queries */
        @media (min-width: 601px) and (max-width: 900px) {
            .character { width: 35%; left: 1%; }
            .dialogue-section { right: 5%; width: 56%; }
            .music-player { width: 320px; }
        }

        @media (max-width: 600px) {
            .paper { width: 100%; height: calc(100svh - 24px); min-height: 560px; }
            .logo { top: 15px; left: 5%; width: clamp(65px, 16vw, 85px); border-width: 5px; }
            .character { left: -2%; width: 44%; height: 52%; }
            .dialogue-section { top: 14%; right: 4%; width: 62%; gap: 16px; }
            .thought-bubble { min-height: 95px; border-radius: 32px; padding: 15px 18px; font-size: clamp(15px, 4vw, 20px); }
            .button { width: 85%; height: 50px; font-size: 20px; }
            .music-player { width: min(260px, 68%); min-height: 170px; padding: 12px 15px; border-radius: 28px 0 0 0; }
        }
    </style>
</head>

<body>

    <main class="paper">
        <div class="logo">
            <img src="assets/fpe_logo.png" alt="FPE Logo">
        </div>

        <div class="character">
            <img id="charImg" src="assets/hello_agetha.png" alt="Character">
        </div>

        <div class="dialogue-section">
            <div class="thought-bubble" id="dialogueText"></div>
            <button class="button" id="continueBtn">
                continue
            </button>
        </div>

        <div class="music-player">
            <p class="music-title" id="musicName">FPE - Welcome</p>

            <div class="music-line" id="musicLine">
                <div class="music-progress" id="musicProgress"></div>
            </div>

            <div class="time-display">
                <span id="currentTime">0:00</span>
                <span id="duration">0:00</span>
            </div>

            <div class="player-controls">
                <button id="playBtn" title="Play / Pause">▶</button>
                <button id="stopBtn" title="Stop">■</button>
            </div>

            <div class="volume-control">
                <span>♪</span>
                <input type="range" id="volumeSlider" min="0" max="100" value="100">
                <span class="volume-value" id="volumeValue">100%</span>
            </div>

            <audio id="audio" src="assets/fpe_welcome.mp3"></audio>
        </div>
    </main>

    <script>
        const frames = [
            { text: "yo hello deenik", image: "assets/hello_agetha.png" },
            { text: "you just birthday right?, you must be a 17yo", image: "assets/thinking_agetha.png" },
            { text: "and you must be a nice woman to future ok", image: "assets/mad_agetha.png" },
            { text: "well i have something for you", image: "assets/cat_agetha.png" }
        ];

        let currentFrame = 0;
        let isTyping = false;
        let typingTimeout = null;

        const dialogueText = document.getElementById("dialogueText");
        const charImg = document.getElementById("charImg");
        const continueBtn = document.getElementById("continueBtn");

        // Fungsi efek mengetik teks (Typewriter Effect)
        function typeWriter(text, i = 0) {
            isTyping = true;
            continueBtn.disabled = true; // Nonaktifkan tombol sementara teks sedang diketik

            if (i === 0) {
                dialogueText.textContent = "";
            }

            if (i < text.length) {
                dialogueText.textContent += text.charAt(i);
                typingTimeout = setTimeout(() => typeWriter(text, i + 1), 40); // Kecepatan ketik (milidetik)
            } else {
                isTyping = false;
                continueBtn.disabled = false;
            }
        }

        // Jalankan frame tertentu
        function showFrame(index) {
            if (index < frames.length) {
                const frame = frames[index];
                charImg.src = frame.image;
                
                // Mulai efek ketik teks
                typeWriter(frame.text);
            } else {
                window.location.href = "deenikfat3.html";
            }
        }

        // Event tombol continue diklik
        continueBtn.addEventListener("click", () => {
            if (isTyping) {
                // Jika sedang mengetik, langsung selesaikan teks secara instan
                clearTimeout(typingTimeout);
                dialogueText.textContent = frames[currentFrame].text;
                isTyping = false;
                continueBtn.disabled = false;
            } else {
                // Lanjut ke frame berikutnya
                currentFrame++;
                showFrame(currentFrame);
            }
        });

        // Jalankan frame pertama otomatis saat halaman dimuat
        window.addEventListener("DOMContentLoaded", () => {
            showFrame(currentFrame);
        });

        // --- Logika Sinkronisasi Music Player Antar Halaman ---
        const audio = document.getElementById("audio");
        const playBtn = document.getElementById("playBtn");
        const stopBtn = document.getElementById("stopBtn");
        const musicName = document.getElementById("musicName");
        const musicLine = document.getElementById("musicLine");
        const musicProgress = document.getElementById("musicProgress");
        const currentTimeDisplay = document.getElementById("currentTime");
        const durationDisplay = document.getElementById("duration");
        const volumeSlider = document.getElementById("volumeSlider");
        const volumeValue = document.getElementById("volumeValue");

        musicName.textContent = "FPE - Welcome";

        const savedTime = localStorage.getItem("audioTime");
        const savedVolume = localStorage.getItem("audioVolume");
        const isPlaying = localStorage.getItem("audioPlaying") === "true";

        if (savedVolume !== null) {
            audio.volume = Number(savedVolume);
            volumeSlider.value = Number(savedVolume) * 100;
            volumeValue.textContent = `${Math.round(Number(savedVolume) * 100)}%`;
        }

        if (savedTime !== null) {
            audio.currentTime = Number(savedTime);
        }

        if (isPlaying) {
            audio.play().then(() => {
                playBtn.textContent = "Ⅱ";
            }).catch(err => console.log("Autoplay blocked:", err));
        }

        function formatTime(time) {
            if (!Number.isFinite(time)) return "0:00";
            const minutes = Math.floor(time / 60);
            const seconds = Math.floor(time % 60);
            return `${minutes}:${String(seconds).padStart(2, "0")}`;
        }

        audio.addEventListener("timeupdate", () => {
            if (audio.duration) {
                const progress = (audio.currentTime / audio.duration) * 100;
                musicProgress.style.width = `${progress}%`;
                currentTimeDisplay.textContent = formatTime(audio.currentTime);
                localStorage.setItem("audioTime", audio.currentTime);
            }
        });

        playBtn.addEventListener("click", async () => {
            if (audio.paused) {
                try {
                    await audio.play();
                    playBtn.textContent = "Ⅱ";
                    localStorage.setItem("audioPlaying", "true");
                } catch (error) {
                    console.error("Music playback failed:", error);
                }
            } else {
                audio.pause();
                playBtn.textContent = "▶";
                localStorage.setItem("audioPlaying", "false");
            }
        });

        stopBtn.addEventListener("click", () => {
            audio.pause();
            audio.currentTime = 0;
            playBtn.textContent = "▶";
            localStorage.setItem("audioTime", 0);
            localStorage.setItem("audioPlaying", "false");
        });

        audio.addEventListener("loadedmetadata", () => {
            durationDisplay.textContent = formatTime(audio.duration);
        });

        musicLine.addEventListener("pointerdown", (event) => {
            if (!audio.duration) return;
            const rect = musicLine.getBoundingClientRect();
            const clickPosition = Math.max(0, Math.min(event.clientX - rect.left, rect.width));
            const percentage = clickPosition / rect.width;
            audio.currentTime = percentage * audio.duration;
            localStorage.setItem("audioTime", audio.currentTime);
        });

        volumeSlider.addEventListener("input", () => {
            const volume = Number(volumeSlider.value);
            audio.volume = volume / 100;
            volumeValue.textContent = `${volume}%`;
            localStorage.setItem("audioVolume", audio.volume);
        });

        audio.addEventListener("ended", () => {
            playBtn.textContent = "▶";
            localStorage.setItem("audioPlaying", "false");
        });

        audio.addEventListener("play", () => {
            playBtn.textContent = "Ⅱ";
            localStorage.setItem("audioPlaying", "true");
        });

        audio.addEventListener("pause", () => {
            playBtn.textContent = "▶";
            localStorage.setItem("audioPlaying", "false");
        });
    </script>

</body>
</html>
