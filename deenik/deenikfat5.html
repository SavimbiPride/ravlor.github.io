<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lesbians</title>

    <style>
        @font-face {
            font-family: 'FPEFont';
            src: url('assets/Barrio-Regular.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            min-height: 100svh;
            background: #1f1f1f;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'FPEFont', Arial, sans-serif;
            padding: 20px;
        }

        .paper {
            position: relative;
            width: min(95%, 1000px);
            height: min(600px, calc(100svh - 40px));
            min-height: 480px;
            background-color: #ffffff;
            overflow: hidden;
            background-image:
                linear-gradient(to right,
                    transparent 13%,
                    #d47d89 13%,
                    #d47d89 13.3%,
                    transparent 13.3%
                ),
                repeating-linear-gradient(to bottom,
                    transparent 0px,
                    transparent 30px,
                    #70c7ef 31px,
                    #70c7ef 32px
                );
        }

        /* Logo */
        .logo {
            position: absolute;
            top: 20px;
            left: 6%;
            width: clamp(65px, 10vw, 95px);
            aspect-ratio: 1 / 1;
            border: 6px solid #403747;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: white;
            z-index: 4;
            overflow: hidden;
        }

        .logo img {
            width: 85%;
            height: 85%;
            object-fit: contain;
            display: block;
        }

        /* Tombol Kembali */
        .back-btn {
            position: absolute;
            top: 20px;
            right: 30px;
            background: #403747;
            color: white;
            border: none;
            border-radius: 30px;
            padding: 10px 24px;
            font-family: 'FPEFont', Arial, sans-serif;
            font-size: clamp(16px, 2.2vw, 22px);
            cursor: pointer;
            z-index: 4;
            transition: 0.2s;
        }

        .back-btn:hover {
            background: #55495e;
            transform: scale(1.05);
        }

        /* Konten Galeri */
        .gallery-content {
            position: absolute;
            top: 18%;
            left: 15%;
            right: 5%;
            bottom: 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 25px;
            z-index: 3;
        }

        /* Kolom Kiri (2 Gambar Bertumpuk) */
        .left-column {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 36%;
            height: 100%;
        }

        .art-box {
            background: #ffffff;
            border: 3px solid #403747;
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 6px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        .art-box.top-art {
            height: 48%;
        }

        .art-box.bottom-art {
            height: 48%;
        }

        .art-box img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            display: block;
        }

        /* Kolom Kanan (1 Gambar Besar) */
        .right-column {
            width: 58%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #2b2630;
            border: 4px solid #403747;
            border-radius: 20px;
            overflow: hidden;
            padding: 10px;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
        }

        .right-column img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            display: block;
        }

        /* Tablet */
        @media (min-width: 601px) and (max-width: 900px) {
            .paper {
                width: 100%;
                height: min(600px, calc(100svh - 30px));
            }
        }

        /* Mobile */
        @media (max-width: 600px) {
            .paper {
                width: 100%;
                height: calc(100svh - 24px);
                min-height: 540px;
            }

            .logo {
                top: 15px;
                left: 5%;
                width: clamp(55px, 14vw, 75px);
                border-width: 4px;
            }

            .back-btn {
                top: 15px;
                right: 15px;
                padding: 8px 16px;
                font-size: 16px;
            }

            .gallery-content {
                flex-direction: column;
                top: 16%;
                left: 14%;
                right: 4%;
                bottom: 4%;
                gap: 12px;
            }

            .left-column {
                width: 100%;
                flex-direction: row;
                height: 32%;
                gap: 10px;
            }

            .art-box.top-art,
            .art-box.bottom-art {
                width: 50%;
                height: 100%;
            }

            .right-column {
                width: 100%;
                height: 64%;
            }
        }
    </style>
</head>

<body>

    <main class="paper">
        <div class="logo">
            <img src="assets/fpe_logo.png" alt="FPE Logo">
        </div>

        <!-- Tombol Kembali -->
        <button class="back-btn" onclick="window.location.href='deenikfat3.html'">
            &larr; back
        </button>

        <!-- Layout Galeri Gambar (Frame 7) -->
        <div class="gallery-content">
            <div class="left-column">
                <div class="art-box top-art">
                    <img src="assets/4.jpeg" alt="Miss Circle Supremacy">
                </div>
                <div class="art-box bottom-art">
                    <img src="assets/1.jpeg" alt="Miss Circle Bunny">
                </div>
            </div>
            
            <div class="right-column">
                <img src="assets/2.jpeg" alt="Miss Circle Close Up">
            </div>
        </div>

        <!-- Audio latar belakang yang tetap berjalan mulus dari halaman sebelumnya -->
        <audio id="audio" src="assets/fpe_welcome.mp3"></audio>
    </main>

    <script>
        // Sinkronisasi pemutar musik latar dengan localStorage
        const audio = document.getElementById("audio");

        const savedTime = localStorage.getItem("audioTime");
        const savedVolume = localStorage.getItem("audioVolume");
        const isPlaying = localStorage.getItem("audioPlaying") === "true";

        if (savedVolume !== null) {
            audio.volume = Number(savedVolume);
        }

        if (savedTime !== null) {
            audio.currentTime = Number(savedTime);
        }

        if (isPlaying) {
            audio.play().catch(err => console.log("Autoplay blocked:", err));
        }

        audio.addEventListener("timeupdate", () => {
            if (audio.duration) {
                localStorage.setItem("audioTime", audio.currentTime);
            }
        });

        audio.addEventListener("ended", () => {
            localStorage.setItem("audioPlaying", "false");
        });
    </script>

</body>
</html>
