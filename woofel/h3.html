<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>yay</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet" />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Poppins", sans-serif;
        /* Menyelaraskan background dengan halaman pertama */
        background: url('img/background.jpeg');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
        overflow: hidden;
        padding: 20px;
      }

      #mainCard {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 25px;
        width: 100%;
        max-width: 500px; /* Batas maksimal lebar radio */
      }

      /* RADIO CONTAINER (BENTUK KOTAK MUTLAK & RESPONSIF) */
      .radio-container {
        position: relative;
        width: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }

      /* ANTENA */
      .antenna {
        position: absolute;
        width: 8px;
        height: 120px;
        background: #000000;
        top: -100px; 
        left: 50px;
        transform: rotate(-30deg);
        transform-origin: bottom;
        border-radius: 5px;
        z-index: 1;
        animation: wobble 3s infinite ease-in-out;
      }

      @keyframes wobble {
        0%, 100% { transform: rotate(-30deg); }
        50% { transform: rotate(-35deg); }
      }

      /* BODY RADIO - DIUBAH JADI KOTAK SEMPURNA (MONOKROM) */
      .radio-body {
        position: relative;
        width: 100%;
        background: #ffffff; /* Warna putih dominan */
        border: 6px solid #000000; /* Pinggiran hitam tegas */
        border-radius: 0px; /* 0px agar benar-benar kotak lancip */
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
        padding: 30px 20px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
        z-index: 2;
        gap: 20px;
      }

      /* DISPLAY (MONOKROM STYLE) */
      .radio-display {
        flex: 1;
        height: 150px;
        background: #888888; /* Warna abu-abu */
        border: 3px solid #000000;
        border-radius: 0px; /* Kotak lancip */
        padding: 12px;
        font-size: 13px;
        color: #ffffff;
        overflow-y: auto;
        box-shadow: inset 0 0 10px rgba(0,0,0,0.3);
      }

      .station {
        cursor: pointer;
        padding: 6px 0;
        border-bottom: 1px solid rgba(255,255,255,0.2);
        color: #dddddd;
      }

      .station.active {
        font-weight: 600;
        color: #000000; /* Teks hitam pekat saat aktif */
        background: #ffffff;
        padding-left: 5px;
      }

      /* KONTROL SEBELAH KIRI */
      .left-controls {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
      }

      /* CONTROLS (GRID LAYOUT) */
      .controls {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }

      .btn {
        width: 45px;
        height: 45px;
        background: #000000; /* Tombol Hitam */
        color: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 0px; /* Kotak */
        font-size: 16px;
        cursor: pointer;
        transition: 0.2s;
        border: none;
      }

      .btn:active {
        transform: scale(0.95);
        background: #444444;
      }

      /* DIAL POWER KOTAK */
      .dial {
        width: 60px;
        height: 60px;
        background: #888888; /* Abu-abu */
        border: 4px solid #000000;
        border-radius: 0px; /* Diubah jadi kotak */
        cursor: pointer;
        transition: 0.3s;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      }

      .dial::after {
        content: "OFF";
        font-size: 11px;
        font-weight: bold;
        color: #000000;
        transition: 0.3s;
      }

      .dial.active {
        background: #ffffff;
      }

      .dial.active::after {
        content: "ON";
        color: #000000;
      }

      /* RESET BUTTON (MENYESUAIKAN HALAMAN 1) */
      .btn-reset {
        background: #d9d9d9; /* Abu-abu terang */
        color: #000000;
        border: 2px solid #ffffff;
        border-radius: 50px;
        padding: 12px 80px;
        font-size: 1.1rem;
        cursor: pointer;
        transition: 0.3s;
        box-shadow: 0 0 20px rgba(255,255,255,0.15);
        text-transform: lowercase;
      }

      .btn-reset:hover {
        background: #444444;
        color: #ffffff;
        transform: scale(1.05);
      }

      /* RESPONSIVE LAYOUT UNTUK HP (SCREEN DI BAWAH 480PX) */
      @media (max-width: 480px) {
        .radio-body {
          flex-direction: column; /* Susunan tombol & layar jadi atas-bawah di HP */
          padding: 20px;
          gap: 15px;
        }

        .left-controls {
          flex-direction: row-reverse; /* Menyusun tombol berdampingan di HP */
          justify-content: space-between;
          width: 100%;
        }

        .radio-display {
          width: 100%;
          height: 130px;
        }

        .antenna {
          height: 90px;
          top: -75px;
          left: 30px;
        }
        
        .btn-reset {
          padding: 12px 50px;
          font-size: 1rem;
        }
      }
    </style>
  </head>

  <body>
    <div id="mainCard">
      <div class="radio-container">
        <div class="antenna"></div>

        <div class="radio-body">
          <div class="left-controls">
            <div class="dial" title="Power ON/OFF"></div>
            
            <div class="controls">
              <div class="btn" id="prev">⏮️</div>
              <div class="btn" id="volUp">🔼</div>
              <div class="btn" id="volDown">🔽</div>
              <div class="btn" id="next">⏭️</div>
            </div>
          </div>
          
          <div class="radio-display" id="display"></div>
        </div>
      </div>

      <button id="resetBtn" class="btn-reset">reset</button>
    </div>

    <audio id="audio"></audio>

    <script>
      let isOn = false;
      let volume = 0.5;
      let current = 0;

      const dial = document.querySelector(".dial");
      const display = document.getElementById("display");
      const audio = document.getElementById("audio");

      const volUp = document.getElementById("volUp");
      const volDown = document.getElementById("volDown");
      const nextBtn = document.getElementById("next");
      const prevBtn = document.getElementById("prev");

      const stations = [
        "img/bang.mp3",
        "img/basic in behavior.mp3"
      ];

      function loadStation() {
        audio.src = stations[current];
        audio.volume = volume;
      }

      function render() {
        if (!isOn) {
          display.innerHTML = "<p style='text-align:center;margin-top:45px;font-weight:bold;color:rgba(255,255,255,0.4)'>RADIO OFF</p>";
          return;
        }

        display.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center;">
             <b style="color:#000000; background:#ffffff; padding: 0 4px;">LIVE</b>
             <small style="font-weight:bold;">Vol: ${Math.round(volume * 100)}%</small>
          </div>
          <hr style="margin:8px 0; border:0; border-top:1px solid #000000">
          ${stations.map((s, i) => `
            <div class="station ${i === current ? "active" : ""}" onclick="play(${i})">
              ${i === current ? "◼️" : "▫️"} ${s.replace('img/', '')}
            </div>
          `).join("")}
        `;
      }

      window.play = function (i) {
        if(!isOn) return;
        current = i;
        loadStation();
        audio.play();
        render();
      };

      dial.onclick = () => {
        isOn = !isOn;
        dial.classList.toggle("active");

        if (isOn) {
          loadStation();
          audio.play();
        } else {
          audio.pause();
        }
        render();
      };

      volUp.onclick = () => {
        if (!isOn) return;
        volume = Math.min(volume + 0.1, 1);
        audio.volume = volume;
        render();
      };

      volDown.onclick = () => {
        if (!isOn) return;
        volume = Math.max(volume - 0.1, 0);
        audio.volume = volume;
        render();
      };

      function nextSong() {
        current = (current + 1) % stations.length;
        loadStation();
        audio.play();
        render();
      }

      function prevSong() {
        current = (current - 1 + stations.length) % stations.length;
        loadStation();
        audio.play();
        render();
      }

      nextBtn.onclick = () => isOn && nextSong();
      prevBtn.onclick = () => isOn && prevSong();

      audio.onended = nextSong;

      document.getElementById("resetBtn").onclick = () => {
        setTimeout(() => (window.location.href = "h1.html"), 200);
      };

      render();
    </script>
  </body>
</html>
